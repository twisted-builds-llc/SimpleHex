name: tests
on: [push, pull_request]
jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.8: oldest supported syntax; 3.11: what FreeCAD 1.0/1.1 bundle.
        python: ["3.8", "3.11"]
    container: python:${{ matrix.python }}-slim
    steps:
      - uses: actions/checkout@v4
      - run: pip install pytest
      - run: pytest
